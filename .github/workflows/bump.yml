name: bump

on:
  schedule:
    - cron: "17 5 * * *"
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to set (X.Y.Z); empty means the latest release"
        required: false
        default: ""

permissions:
  contents: write

# Cron, manual and release-triggered runs share one queue so two pushes never race.
concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${INPUT_VERSION:-$PAYLOAD_VERSION}"
          if [ -z "$version" ]; then
            tag="$(gh release view --repo mesh-town/meshtown --json tagName -q .tagName)"
            version="${tag#v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Bump formula
        run: scripts/bump.sh "$VERSION"

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "Formula is up to date"
            exit 0
          fi
          git -c user.name='Mesh Town' -c user.email='340663027+mesh-town@users.noreply.github.com' commit -am "meshtown $VERSION"
          git push
